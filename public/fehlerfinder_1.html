<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sauerteig Fehlerfinder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #f2ecf0;
      --bg2: #e8dde5;
      --text-dark: #4e364a;
      --text-mid: #7a5e75;
      --text-soft: #8e6d82;
      --accent: #a885a0;
      --border: #ddc8d5;
      --white-glass: rgba(255,255,255,0.75);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: 'Cormorant Garamond', serif;
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(24px);
      opacity: 0.45;
      z-index: 0;
      mix-blend-mode: multiply;
    }
    .blob1 {
      width: 360px; height: 360px; left: -100px; top: -70px;
      background: radial-gradient(circle, rgba(221,200,213,0.95) 0%, rgba(221,200,213,0.45) 55%, rgba(221,200,213,0) 100%);
    }
    .blob2 {
      width: 320px; height: 320px; right: -90px; top: 28%;
      background: radial-gradient(circle, rgba(185,157,174,0.9) 0%, rgba(185,157,174,0.35) 55%, rgba(185,157,174,0) 100%);
    }
    .blob3 {
      width: 360px; height: 360px; left: 18%; bottom: -100px;
      background: radial-gradient(circle, rgba(216,194,208,0.9) 0%, rgba(216,194,208,0.4) 55%, rgba(216,194,208,0) 100%);
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      animation: fadeIn 0.45s ease;
    }

    .header-small {
      text-align: center;
      margin-bottom: 38px;
    }

    .brand {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-soft);
      margin: 0 0 6px;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(142,109,130,0.6);
    }
    .divider-line {
      width: 40px;
      height: 1px;
      background: rgba(142,109,130,0.4);
    }

    .hero { text-align: center; margin-bottom: 40px; }
    .hero h1 {
      font-family: 'Allura', cursive;
      font-size: clamp(3rem, 8vw, 4rem);
      line-height: 1;
      font-weight: 400;
      color: var(--text-dark);
      margin: 0 0 12px;
    }
    .hero p {
      margin: 0 auto;
      max-width: 320px;
      color: var(--text-mid);
      font-size: 1.1rem;
      line-height: 1.5;
      font-style: italic;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card, .cause-btn {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(157,123,123,0.08);
      transition: all 0.25s ease;
    }

    .card {
      border-radius: 20px;
      padding: 22px 18px;
      text-align: center;
      cursor: pointer;
    }
    .card:hover, .cause-btn:hover {
      background: rgba(255,255,255,0.92);
      border-color: var(--accent);
      transform: translateY(-3px);
    }
    .card-emoji { font-size: 2rem; margin-bottom: 10px; }
    .card-title {
      font-size: 1.05rem;
      line-height: 1.15;
      font-style: italic;
      font-weight: 500;
      color: var(--text-dark);
      margin: 0;
    }

    .top-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-soft);
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      margin: 0 auto 30px;
    }
    .top-back:hover { color: var(--text-dark); }
    .top-back-wrap { text-align: center; }

    .problem-head { text-align: center; margin-bottom: 34px; }
    .problem-emoji { font-size: 3.2rem; margin-bottom: 10px; }
    .problem-title {
      font-family: 'Allura', cursive;
      font-size: clamp(2.5rem, 7vw, 3rem);
      line-height: 1.1;
      font-weight: 400;
      color: var(--text-dark);
      margin: 0 0 8px;
      padding: 0 12px;
    }
    .problem-sub {
      font-size: 1rem;
      font-style: italic;
      color: var(--text-mid);
      margin: 0;
    }

    .cause-list { display: flex; flex-direction: column; gap: 12px; }
    .cause-btn {
      width: 100%;
      border-radius: 16px;
      padding: 16px 18px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .cause-number {
      font-family: 'Allura', cursive;
      font-size: 1.8rem;
      color: var(--accent);
      flex: 0 0 auto;
      min-width: 20px;
      line-height: 1;
    }
    .cause-label {
      flex: 1;
      font-size: 1.1rem;
      line-height: 1.15;
      font-style: italic;
      font-weight: 500;
      color: var(--text-dark);
    }
    .cause-arrow {
      color: var(--accent);
      opacity: 0.55;
      font-size: 1.1rem;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .cause-btn:hover .cause-arrow {
      opacity: 1;
      transform: translateX(3px);
    }

    .breadcrumb {
      text-align: center;
      color: var(--text-soft);
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .breadcrumb .problem { text-transform: uppercase; letter-spacing: 0.15em; }
    .breadcrumb .dot { margin: 0 10px; opacity: 0.4; }
    .breadcrumb .cause {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--text-dark);
      font-size: 14px;
      letter-spacing: 0;
      text-transform: none;
    }

    .section-why {
      text-align: center;
      padding: 0 10px;
      margin-bottom: 24px;
    }
    .section-kicker {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: var(--accent);
      margin: 0 0 14px;
      font-weight: 500;
    }
    .why-text {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.55;
      font-style: italic;
      color: var(--text-dark);
    }

    .solution-divider {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
      color: var(--accent);
    }
    .solution-divider .divider-line { width: 48px; background: rgba(168,133,160,0.4); }

    .solution-card {
      position: relative;
      margin-top: 8px;
      background: rgba(255,255,255,0.84);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(168,133,160,0.4);
      border-radius: 24px;
      padding: 34px 28px 28px;
      box-shadow: 0 8px 32px rgba(157,123,123,0.12);
    }
    .solution-pill {
      position: absolute;
      left: 50%;
      top: -18px;
      transform: translateX(-50%);
      background: var(--accent);
      color: white;
      border-radius: 999px;
      padding: 6px 20px;
      font-family: 'Allura', cursive;
      font-size: 1.35rem;
      line-height: 1.1;
      white-space: nowrap;
    }
    .solution-text {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.65;
      color: #3e2a3c;
    }

    .actions {
      margin-top: 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .primary-btn, .secondary-btn {
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .primary-btn {
      background: var(--accent);
      color: white;
      border-radius: 999px;
      padding: 14px 28px;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .primary-btn:hover { background: var(--text-dark); }
    .secondary-btn {
      background: transparent;
      color: var(--text-soft);
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .secondary-btn:hover { color: var(--text-dark); }

    .footer-home {
      margin-top: 62px;
      text-align: center;
    }
    .footer-home .script {
      font-family: 'Allura', cursive;
      font-size: 1.5rem;
      color: var(--text-soft);
      margin: 0;
    }
    .footer-home .meta {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: 8px;
    }

    .icon-svg { display: inline-block; vertical-align: middle; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .wrap { padding: 34px 16px 64px; }
      .grid { grid-template-columns: 1fr 1fr; }
      .card { padding: 18px 14px; }
      .card-title { font-size: 1rem; }
      .solution-card { padding: 32px 20px 24px; }
      .solution-text, .why-text { font-size: 1.12rem; }
    }

    @media (max-width: 390px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="noise"></div>
  <div id="app" class="wrap"></div>

      {

function getCompareBlock(problemId, causeLabel){
  if (![3,7,9,10,11].includes(problemId)) return "";

  const cause = (causeLabel || "").toLowerCase();
  let intro = "";

  if (problemId === 3) {
    if (cause.includes("kerntemperatur")) {
      intro = "👉 Hier hilft ein verlässliches Backgefäß, weil dein Brot gleichmäßiger ausbacken kann.";
    } else if (cause.includes("dampf")) {
      intro = "👉 Hier spielt das Backklima eine große Rolle, damit dein Brot nicht feucht und speckig bleibt.";
    } else if (cause.includes("backzeit")) {
      intro = "👉 Auch hier hilft ein gutes Backgefäß, weil dein Brot gleichmäßiger und kontrollierter ausbackt.";
    } else {
      intro = "👉 Auch wenn die Ursache nicht nur am Backen liegt, kann das richtige Backgefäß dein Ergebnis deutlich verbessern.";
    }
  }

  if (problemId === 7) {
    if (cause.includes("schnitt")) {
      intro = "👉 Der Schnitt ist wichtig – aber ohne passendes Backklima kann sich dein Brot trotzdem nicht sauber öffnen.";
    } else if (cause.includes("dampf")) {
      intro = "👉 Genau hier entscheidet das Backklima darüber, ob sich dein Brot richtig öffnen kann.";
    } else {
      intro = "👉 Das Backklima unterstützt hier stark – auch wenn Schnitt und Gare genauso wichtig bleiben.";
    }
  }

  if (problemId === 9) {
    if (cause.includes("dampf")) {
      intro = "👉 Hier hilft ein kontrolliertes Backklima, damit die Kruste nicht sofort verhärtet.";
    } else {
      intro = "👉 Auch das Backgefäß beeinflusst, wie deine Kruste am Ende wird.";
    }
  }

  if (problemId === 10) {
    if (cause.includes("ofen nicht heiß")) {
      intro = "👉 Hier hilft ein gutes Backgefäß, weil die Hitze gebündelter am Brot ankommt.";
    } else {
      intro = "👉 Das Backklima spielt hier eine größere Rolle, als viele denken.";
    }
  }

  if (problemId === 11) {
    if (cause.includes("dampf")) {
      intro = "👉 Genau hier macht das Backklima den Unterschied, wie dein Brot aufreißt.";
    } else {
      intro = "👉 Auch das Backumfeld beeinflusst, wo dein Brot aufreißt.";
    }
  }

  return `
  <div style="margin-top:20px; text-align:center;">
    <p style="font-style:italic; margin-bottom:14px;">
      ${intro}
    </p>

    <div class="actions">
      <a href="https://www.pamperedchef.eu/pws/FelicitasReitmeier/store/DEO/catalog/Stoneware/Deep%20Covered%20Baker-2023"
         target="_blank"
         class="primary-btn">

      <a href="https://www.pamperedchef.eu/pws/FelicitasReitmeier/eventstore428480/DEO/catalog/Stoneware/Mini%20Deep%20Covered%20Baker-2023"
         target="_blank"
         class="secondary-btn">
         🌸 Lilly – für kleinere Brote
      </a>
    </div>
  </div>
  `;
}
